version: "3.9"
services:
  db:
    image: postgres:15
    container_name: kitsune_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: proyectos
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    build: ./api
    container_name: kitsune_api
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://user:password@db:5432/proyectos
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app

volumes:
  db_data:
